[package]
name = "logger_srcfile"
version = "0.2.0"
authors = ["Maxwell Huang-Hobbs <mhuan13@gmail.com>"]
edition = "2018"

[lib]
crate-type = ["lib"]

[features]
swc-compat = ["dep:swc_common"]

[dependencies]
logger = { path = "../logger" }
once_cell = "1"
oxc_diagnostics.workspace = true
oxc_span.workspace = true
swc_common = { workspace = true, optional = true }
