[package]
name = "bundler"
version = "0.1.0"
edition = "2021"
rust-version = "1.95"
license = "Apache-2.0"
description = "Owned graph retention, exact chunk planning and native ESM emission"

[dependencies]
cssparser = "0.35"
sasso = { version = "=0.21.0", default-features = false }
oxc-css-parser = { git = "https://github.com/oxc-project/oxc-css-parser", rev = "6e1604ddd0ad0d08279aac4a2910ff8ca585f7c6" }
ecco = { path = "../ecco" }
ast-segmenter = { path = "../ast_segmenter" }
source_graph = { path = "../source_graph" }
eyre.workspace = true
tracing.workspace = true
oxc_span.workspace = true
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_ast_visit.workspace = true
oxc_parser.workspace = true
oxc_semantic.workspace = true
oxc_codegen.workspace = true
oxc_transformer.workspace = true
oxc_sourcemap = "6.1.1"
logger = { path = "../logger" }
serde_json.workspace = true
sha2 = "0.10.9"
segment_cache = { path = "../segment_cache" }
cache_flatbuffers = { path = "../cache_flatbuffers" }
base64 = "0.22"
percent-encoding = "2"
import_resolver = { path = "../import_resolver" }
serde.workspace = true
tempfile = "3.27.0"
url = "2"

[dev-dependencies]
tracing-chrome = "0.7"
tracing-subscriber = { version = "0.3", default-features = false, features = ["registry"] }
insta = { version = "1", default-features = false }
test_tmpdir = { path = "../test_tmpdir" }

[[bench]]
name = "incremental"
harness = false
