[package]
name = "bundler"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Owned graph effect and retention analysis for the incremental bundler"

[dependencies]
ast-segmenter = { path = "../ast_segmenter" }
source_graph = { path = "../source_graph" }
eyre.workspace = true
oxc_span.workspace = true

[dev-dependencies]
insta = { version = "1", default-features = false }
logger = { path = "../logger" }
segment_cache = { path = "../segment_cache" }
test_tmpdir = { path = "../test_tmpdir" }
