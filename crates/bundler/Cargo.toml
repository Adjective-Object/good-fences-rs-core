[package]
name = "bundler"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Owned graph retention, exact chunk planning and native ESM emission"

[dependencies]
cssparser = "0.35"
ecco = { path = "../ecco" }
ast-segmenter = { path = "../ast_segmenter" }
source_graph = { path = "../source_graph" }
eyre.workspace = true
oxc_span.workspace = true
oxc_allocator.workspace = true
oxc_ast.workspace = true
oxc_ast_visit.workspace = true
oxc_parser.workspace = true
oxc_semantic.workspace = true
logger = { path = "../logger" }
serde_json.workspace = true
sha2 = "0.10.9"
segment_cache = { path = "../segment_cache" }
import_resolver = { path = "../import_resolver" }
serde.workspace = true
tempfile = "3.27.0"
url = "2"

[dev-dependencies]
insta = { version = "1", default-features = false }
test_tmpdir = { path = "../test_tmpdir" }

[[bench]]
name = "incremental"
harness = false
